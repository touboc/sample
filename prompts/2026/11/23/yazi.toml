[mgr]
# 3列レイアウト：親ディレクトリ、現在のディレクトリ、プレビュー
ratio = [2, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll", "touch", "move"]
title_format = "Yazi: {cwd}"

[preview]
tab_size = 2
max_width = 1000
max_height = 1000
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
excel = [
    { run = 'cmd /c start "" "%s1"', orphan = true, desc = "Open with Excel", for = "windows" },
]

edit = [
	{ run = '"C:\Program Files (x86)\sakura\sakura.exe" %s',       desc = "code (block)", for = "windows", block = true },
	{ run = 'code %s', desc = "VS Code", orphan = true, for = "windows" },
	{ run = 'notepad %s', desc = "メモ帳", block = true, for = "windows" },
]
open = [
	{ run = 'start "" %s1', desc = "既定のアプリで開く", orphan = true, for = "windows" },
]
reveal = [
	{ run = 'explorer /select,%s1', desc = "エクスプローラーで表示", orphan = true, for = "windows" },
]
extract = [
	{ run = 'C:\PROGRA~1\7-Zip\7z.exe x %s1', desc = "ここに展開", block = true, for = "windows" },
]
play = [
	{ run = 'start "" %s1', desc = "再生", orphan = true, for = "windows" },
]

[open]
rules = [
	{ url = "*.xlsx", use = "excel" },
	{ url = "*.xls", use = "excel" },
	{ url = "*.xlsm", use = "excel" },
	{ url = "*.csv", use = "excel" },

	{ name = "*/", use = ["edit", "open", "reveal"] },
	{ mime = "text/*", use = ["edit", "reveal"] },
	{ mime = "image/*", use = ["open", "reveal"] },
	{ mime = "video/*", use = ["play", "reveal"] },
	{ mime = "audio/*", use = ["play", "reveal"] },
	{ mime = "application/zip", use = ["extract", "reveal"] },
	{ mime = "application/x-7z-compressed", use = ["extract", "reveal"] },
	{ mime = "application/x-rar", use = ["extract", "reveal"] },
	{ mime = "application/json", use = ["edit", "reveal"] },
	{ name = "*", use = ["open", "reveal"] },
]

[tasks]
micro_workers = 10
macro_workers = 10
bizarre_retry = 5
image_alloc = 536870912
image_bound = [0, 0]
suppress_preload = false

[plugin]

[input]
cursor_blink = true

[confirm]
trash_title = "{n} 個のファイルをごみ箱に移動しますか？"
delete_title = "{n} 個のファイルを完全に削除しますか？"
overwrite_title = "ファイルが既に存在します。上書きしますか？"
quit_title = "実行中のタスクがあります。終了しますか？"

[log]
enabled = false
