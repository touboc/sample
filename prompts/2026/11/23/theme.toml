[filetype]
# ルールは上から順に評価され、最初に一致したものが使われる。
# 26.x では条件キーは "url" を使う（"name" は効かない）。
rules = [
	# リンク切れ（赤背景）
	{ url = "*", is = "orphan", fg = "#1a1b26", bg = "#f7768e" },

	# 隠しフォルダ・隠しファイル（目立たない灰色）
	{ url = "**/.*/", fg = "#6b7394" },
	{ url = "**/.*", fg = "#6b7394" },

	# フォルダ（青・太字）
	{ url = "*/", fg = "#7aa2f7", bold = true },

	# 実行ファイル・スクリプト（青緑・太字）
	{ url = "*", is = "exec", fg = "#4fd6be", bold = true },
	{ url = "*.{exe,msi,bat,cmd,ps1,com}", fg = "#4fd6be", bold = true },

	# Excel（緑）
	{ url = "*.{xls,xlsx,xlsm,xlsb,csv}", fg = "#9ece6a" },

	# Word・PDF（紫）
	{ url = "*.{doc,docx,docm,rtf,pdf}", fg = "#bb9af7" },
	{ mime = "application/pdf", fg = "#bb9af7" },

	# PowerPoint（オレンジ）
	{ url = "*.{ppt,pptx,pptm}", fg = "#ff9e64" },

	# 画像（水色）
	{ mime = "image/*", fg = "#7dcfff" },

	# 動画・音声（黄）
	{ mime = "{audio,video}/*", fg = "#e0af68" },

	# 圧縮ファイル（赤）
	{ url = "*.{zip,7z,rar,tar,gz,tgz,bz2,xz,cab,iso}", fg = "#f7768e" },

	# コード・テキスト（柔らかいベージュ）
	{ mime = "text/*", fg = "#e6dcc3" },
	{ url = "*.{py,js,ts,json,toml,yaml,yml,md,txt,log,html,css,xml,ini,cfg,lua,rs,go}", fg = "#e6dcc3" },

	# 空ファイル（目立たない灰色）
	{ mime = "inode/empty", fg = "#6b7394" },

	# 上記以外の通常ファイル（真っ白ではなく、目に優しい薄い青白）
	{ url = "*", fg = "#c0caf5" },
]
